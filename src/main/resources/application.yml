spring:
  application:
    name: ispilo-backend

  datasource:
    # Heroku Java buildpack automatically sets JDBC_DATABASE_URL, JDBC_DATABASE_USERNAME, JDBC_DATABASE_PASSWORD
    # We use these. If not set (local), we fall back to local defaults.
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/ispilo_db}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  cache:
    type: simple

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  tomcat:
    threads:
      max: 400
      min-spare: 25
    accept-count: 200

jwt:
  secret: ${JWT_SECRET:MjU2Yml0c2VjcmV0a2V5Zm9yaXNwaWxvYXBwbGljYXRpb25jaGFuZ2VpbnByb2R1Y3Rpb24=}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cdn-url: ${APP_BASE_URL:http://localhost:8080}/media
  page-size: 20
  max-page-size: 100
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY:}

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:lesharktechnologies@gmail.com}
  sender-name: ${BREVO_SENDER_NAME:Ispilo}

forgot-password:
  code-ttl-minutes: ${FORGOT_PASSWORD_CODE_TTL_MINUTES:15}
  resend-cooldown-seconds: ${FORGOT_PASSWORD_RESEND_COOLDOWN_SECONDS:60}
  max-attempts: ${FORGOT_PASSWORD_MAX_ATTEMPTS:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ispilo: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
