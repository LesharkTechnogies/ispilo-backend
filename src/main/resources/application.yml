spring:
  application:
    name: ispilo-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  cache:
    type: simple

server:
  port: ${PORT}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  base-url: ${APP_BASE_URL}
  cdn-url: ${APP_CDN_URL}
  page-size: 20
  max-page-size: 100

  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY}

brevo:
  api-key: ${BREVO_API_KEY}
  sender-email: ${BREVO_SENDER_EMAIL}
  sender-name: ${BREVO_SENDER_NAME}

forgot-password:
  code-ttl-minutes: 15
  resend-cooldown-seconds: 60
  max-attempts: 5

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

talksasa:
  api-key: ${TALKSASA_API_KEY}
  sender-id: ${TALKSASA_SENDER_ID}

r2:
  endpoint: ${R2_ENDPOINT}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket-name: ${R2_BUCKET_NAME}
  public-url: ${R2_PUBLIC_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ispilo: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN