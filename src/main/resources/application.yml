spring:
  application:
    name: ispilo-backend

  datasource:
    # Use SPRING_DATASOURCE_URL from environment (Heroku)
    # Default is a placeholder since we are not using MySQL anymore
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

    # Driver is Postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  cache:
    type: simple

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  tomcat:
    threads:
      max: 400
      min-spare: 25
    accept-count: 200

jwt:
  secret: ${JWT_SECRET:MjU2Yml0c2VjcmV0a2V5Zm9yaXNwaWxvYXBwbGljYXRpb25jaGFuZ2VpbnByb2R1Y3Rpb24=}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  base-url: ${BASE_URL:http://localhost:8080}
  cdn-url: ${CDN_URL:http://localhost:8080/media}
  page-size: 20
  max-page-size: 100
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ispilo: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
