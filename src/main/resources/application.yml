spring:
  application:
    name: ispilo-backend

  datasource:
    # We use explicit environment variables for security.
     url: ${DATABASE_URL}
     username: ${DATABASE_USERNAME}
     password: ${DATABASE_PASSWORD}
     driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  cache:
    type: simple

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  tomcat:
    threads:
      max: 400
      min-spare: 25
    accept-count: 200

jwt:
  
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cdn-url: ${APP_BASE_URL:http://localhost:8080}/media
  page-size: 20
  max-page-size: 100
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY:}

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:lesharktechnologies@gmail.com}
  sender-name: ${BREVO_SENDER_NAME:Ispilo}

forgot-password:
  code-ttl-minutes: ${FORGOT_PASSWORD_CODE_TTL_MINUTES:15}
  resend-cooldown-seconds: ${FORGOT_PASSWORD_RESEND_COOLDOWN_SECONDS:60}
  max-attempts: ${FORGOT_PASSWORD_MAX_ATTEMPTS:5}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:dm6ijapq4}
  api_key: ${CLOUDINARY_API_KEY:511788245616987}
  api_secret: ${CLOUDINARY_API_SECRET:5wagQTU7MQBF3wabxy8XRmXcZaw}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ispilo: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

